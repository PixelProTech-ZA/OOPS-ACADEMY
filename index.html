<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>OOPS ACADEMY</title>
<meta name="description" content="OOPS ACADEMY: funny disasters, clever kids, real learning for Grade R to Grade 2. By PixelProTech Solutions.">
<meta name="theme-color" content="#07070a"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OOPS"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff4d6;--ink:#2a1b4d;--card:#fff;--pink:#ff5d8f;--teal:#12b5a6;--sun:#ffc425;--vio:#6b4de6;--ok:#1a9d4b;--bad:#e5484d}
:root[data-theme="dark"]{--bg:#1d1536;--ink:#fff4d6;--card:#2e2352}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1536;--ink:#fff4d6;--card:#2e2352}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Chalkboard SE","Comic Sans MS","Trebuchet MS",sans-serif;font-size:18px;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:clamp(34px,9vw,56px);margin:6px 0;line-height:1;transform:rotate(-2deg);color:var(--pink);text-shadow:3px 3px 0 var(--sun)}
h1 small{display:block;font-size:.4em;color:var(--ink);text-shadow:none;transform:rotate(2deg);margin-top:6px}
button{font:inherit;cursor:pointer;border:3px solid var(--ink);border-radius:18px;background:var(--card);color:var(--ink);padding:12px 16px;box-shadow:0 5px 0 var(--ink);transition:transform .1s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid var(--vio);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1 1 150px}
.grades button.on{background:var(--sun)}
.subj{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0}
.subj button{padding:16px;text-align:left}
.subj .e{font-size:48px;display:block}
.subj b{display:block;font-size:20px}
.stage{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:16px;margin:12px 0}
.who{display:flex;align-items:center;gap:12px}
.face{font-size:72px;line-height:1}
.bubble{background:var(--sun);color:#2a1b4d;border-radius:18px;padding:10px 14px;flex:1}
.shake{animation:shake .5s}.hop{animation:hop .6s}
@keyframes shake{20%{transform:rotate(-14deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(8deg)}}
@keyframes hop{40%{transform:translateY(-24px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.shake,.hop{animation:none}}
.q{font-size:24px;margin:14px 0}.teach{background:#c9f3ee}
.vis{font-size:34px;letter-spacing:4px;word-break:break-all;margin:8px 0}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opts button{font-size:22px;min-height:64px}
.opts button.good{background:#b8f2c9;color:#0b3a1c}.opts button.no{background:#ffc9cb;color:#5c0d10}
.bar{height:16px;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.bar i{display:block;height:100%;background:var(--teal);transition:width .3s}
.stars{font-size:40px}
.note{font-size:14px;opacity:.85;margin-top:14px}
.tools{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tools button{padding:6px 12px;font-size:15px}
:root:root:root{--bg:#07070a;--ink:#f1eefa;--card:#1c1a25;--pink:#00d4aa;--sun:#c7c1da;--vio:#00d4aa;--line:#524b6a}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
h1{color:var(--ink);text-shadow:none;transform:none;letter-spacing:.02em;border-left:6px solid #00d4aa;padding-left:12px}
h1 small{color:#c7c1da;transform:none;font-weight:400;letter-spacing:.04em}
button{border:2px solid var(--line);box-shadow:0 4px 0 #000;border-radius:16px}
button:hover{border-color:#00d4aa}
.grades button.on{background:#00d4aa;color:#07070a;border-color:#00d4aa;font-weight:700}
.stage{border:2px solid var(--line);border-radius:22px}
.bar{border:2px solid var(--line)}
.bubble{background:#2a2640;color:#f1eefa}
.teach{background:#053d34;color:#d6fff5}
.opts button.good{background:#044d41;color:#b9fff0;border-color:#00d4aa}
.opts button.no{background:#3b1d26;color:#ffc9cb;border-color:#e5484d}
.brandbar{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.22em;color:#00d4aa;margin:4px 0 14px}
.brandbar::before{content:"";width:28px;height:2px;background:#00d4aa}
.brandbar span{color:#9a90b8}
footer.brand{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:#c7c1da;line-height:1.7}
footer.brand b{color:#f1eefa;letter-spacing:.08em}
footer.brand a{color:#00d4aa;text-decoration:none}
footer.brand small{display:block;color:#9a90b8;margin-top:8px}
input.nm{font:inherit;font-size:28px;width:100%;padding:12px;border-radius:16px;border:2px solid var(--line);background:#07070a;color:var(--ink);text-align:center}
.go{background:#00d4aa;color:#07070a;font-weight:700;border-color:#00d4aa}
</style></head><body><main id="app" aria-live="polite"></main>
<script>
/* ---------- i18n: add a language by adding a UI block + a CONTENT block ---------- */
const UI={en:{tag:"Funny disasters. Clever kids. Real learning.",grade:"Choose your grade",gR:"Grade R",g1:"Grade 1",g2:"Grade 2",pick:"Pick a disaster to fix!",back:"Back",read:"Listen",mic:"Say it",sound:"Voice",ok:["Yes, {n}! Good job!","Well done, {n}! That is right!","Brilliant, {n}! Yes, good!","Hooray, {n}! You got it!"],calm:"Calm down, {n}. Take a big breath.",done:"Chaos fixed!",again:"Play again",home:"Home",hint:"Tap the right answer, or press Say it and use your voice."}};
const CHARS=[
{n:"Professor Cluckles",e:"🐔",p:1.6,r:1.0,intro:"I am a genius teacher! Mostly. Please help me!"},
{n:"Captain Zingo",e:"🦥",p:.6,r:.75,intro:"I am a super-slow superhero. Help me, Hero!"},
{n:"Mimi Muddle",e:"🦒",p:1.3,r:1.05,intro:"I wore my shoes on my ears again. Oops! Help!"},
{n:"Bolt the Robot",e:"🤖",p:.8,r:.9,intro:"Beep boop. My spelling chip is broken. Fix me!"}];
const SUBJ=[{id:"math",e:"🥚",n:"Egg-splosive Maths",c:0},{id:"eng",e:"🔤",n:"Word Wobbles",c:3},{id:"talk",e:"💬",n:"Talk Time Trouble",c:2},{id:"safe",e:"🛡️",n:"Super Safe Squad",c:1}];
/* item: [grades,char,story,question,correct,wrong1,wrong2,funny] ; math is generated */
const CONTENT={en:{
eng:[
[[0],3,"Bolt says: this picture is a ball, but it starts with Z!","Which sound does BALL start with?","B","Z","M","B-b-ball! Bolt's chip goes boing."],
[[0],3,"Bolt wants a sandwich for his big sister S.","Which word starts with S?","sun","bat","dog","Sun! Bolt made a sun sandwich. Hot!"],
[[0,1],3,"Bolt is writing a poem and got stuck!","Which word rhymes with HAT?","cat","dog","sun","Cat and hat! Bolt did a happy dance."],
[[0],3,"Bolt is singing a rhyme and got it wrong.","Which word rhymes with SUN?","run","cat","bed","Sun, run, fun! Bolt rolled away."],
[[0,1],3,"Bolt typed a word on his screen.","Which one spells THE?","the","teh","hte","T-H-E! Bolt's screen sparkled."],
[[1,2],3,"Bolt wrote: i like cake","What does the sentence need at the start?","A capital letter","A hat","A banana","Capital letters start sentences. Cake time!"],
[[1,2],0,"Cluckles laid one egg. Then another!","One egg, two ...","eggs","eggss","egges","Eggs! Cluckles is egg-cited."],
[[1,2],3,"Bolt is very, very SLOW today.","What is the opposite of slow?","fast","soft","tall","Fast! Bolt zoomed off the page."],
[[2],3,"Bolt's sentences are all mixed up!","Which sentence is written correctly?","The cat sat on the mat.","the cat sat on the mat","The cat sat on the mat","Correct! Capital letter and full stop."],
[[1,2],3,"Bolt forgot something at the end of his sentence.","What goes at the end of a telling sentence?","A full stop","A sock","A wiggle","A full stop! Bolt stamped it with his foot."]],
talk:[
[[0,1,2],2,"Mimi meets a new girl at school and just stares at her shoes.","What is a friendly thing to say?","Hi! I'm Mimi. Want to play?","Go away!","(say nothing and run)","A friendly hello makes a new friend!"],
[[0,1,2],2,"Mimi needs the toilet in the middle of the lesson!","What do you say to the teacher?","Please may I go to the toilet?","Look at my shoes!","Nothing. I will hop.","Asking politely works best. Hop-hop-no!"],
[[0,1,2],2,"Mimi's gran gives her a present, and Mimi grabs it with her teeth!","What should Mimi say?","Thank you!","Gimme more!","Yuck!","Thank you makes people happy!"],
[[0,1,2],2,"Mimi wants to tell Zingo something, but he is talking.","What is the polite thing to do?","Wait, then say 'Excuse me'","Shout louder","Stand on his head","Waiting for your turn is good manners."],
[[0,1,2],2,"Mimi feels sad because her friend would not share.","How can she tell her friend?","I feel sad when you don't share.","I will hide in a bin.","Pull a face and stomp","Using words about feelings really helps!"],
[[1,2],2,"Mimi forgot her lunch and is hungry.","Who could she ask for help?","Her teacher","A pigeon","A tree","Teachers help! Mimi got a sandwich."]],
safe:[
[[0,1,2],1,"A stranger says to Zingo: 'Come in my car, I have sweets!'","What should Zingo do?","Say NO loudly and tell a trusted grown-up","Climb into the car","Take the sweets and smile","NO! Strangers should not ask kids to go with them. Great job!"],
[[0,1,2],1,"Someone says: 'This is our secret. Do not tell anyone!' and it makes Zingo's tummy feel funny.","What should Zingo do?","Tell a trusted grown-up","Keep it secret forever","Hide in a bush","Funny-tummy secrets must be told to a trusted adult."],
[[0,1,2],1,"A friend wants to hug Zingo, but Zingo does not want a hug.","What can Zingo say?","No thank you. I don't want a hug.","Nothing. Just freeze.","Sure, whatever","Your body is yours. You can always say NO!"],
[[0,1,2],1,"Zingo needs help and wants to find a trusted adult.","Who is a trusted adult?","Mom, Dad, Gran or my teacher","Someone I just met","A stranger on the street","Trusted adults are people your family knows and trusts."],
[[0,1,2],1,"Someone online asks Zingo: 'Where do you live?'","What should Zingo do?","Not answer and tell a grown-up","Type his address","Send a photo of his house","Never share where you live. Tell a grown-up!"],
[[1,2],1,"Zingo feels scared and unsafe.","What is the best thing to do?","Go to a trusted adult and tell them","Keep it inside","Run away alone","Telling a trusted adult is brave and smart!"]]
}};
/* ---------- helpers ---------- */
const $=(s)=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[rnd(a.length)];
let lang="en",S={grade:1,voice:true,subj:null,qs:[],i:0,stars:0,tries:0,done:false};
try{const v=localStorage.getItem("oops.grade");if(v!==null)S.grade=+v;S.name=localStorage.getItem("oops.name")||"";}catch(e){S.name=""}
function speak(t,c){if(!S.voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang==="en-ZA")||vs.find(v=>/female|samantha|zira|susan|karen|moira/i.test(v.name)&&v.lang.startsWith("en"))||vs.find(v=>v.lang.startsWith("en"))||null;u.lang="en-ZA";u.pitch=1;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function distract(c,lo,hi){const s=new Set([c]);while(s.size<3){const d=c+pick([-2,-1,1,2,3]);if(d>=lo&&d<=hi)s.add(d)}return [...s]}
function mathQ(g){let c,story,q,vis="";
if(g===0){const n=1+rnd(9);vis="🥚".repeat(n);story="Professor Cluckles laid a pile of eggs and forgot how to count them!";q="How many eggs can you count?";c=n;}
else if(g===1){const a=1+rnd(9),b=1+rnd(10);story=`Professor Cluckles has ${a} eggs. Then she finds ${b} more under her hat!`;q=`${a} + ${b} = ?`;c=a+b;vis="🥚".repeat(a)+" ➕ "+"🥚".repeat(b);}
else if(rnd(2)){const a=10+rnd(30),b=1+rnd(15);story=`Professor Cluckles has ${a} eggs. She sits on ${b} more by mistake!`;q=`${a} + ${b} = ?`;c=a+b;}
else{const a=15+rnd(30),b=1+rnd(12);story=`Cluckles had ${a} eggs but ${b} rolled down the hill. Oops!`;q=`${a} − ${b} = ?`;c=a-b;}
return{c:0,story,q,vis,ans:String(c),opts:distract(c,0,99).map(String),fun:"Cluckles counted: "+c+"! Eggs-cellent!"};}
function build(subj,g){if(subj.id==="math")return Array.from({length:5},()=>({ch:0,...mathQ(g)}));
let pool=CONTENT[lang][subj.id].filter(x=>x[0].includes(g));
return shuf(pool).slice(0,5).map(x=>({ch:x[1],story:x[2],q:x[3],vis:"",ans:x[4],opts:[x[4],x[5],x[6]],fun:x[7]}));}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function saveName(v){v=v.trim().replace(/[<>&"'`]/g,"").slice(0,16);if(!v)return;S.name=v.charAt(0).toUpperCase()+v.slice(1);try{localStorage.setItem("oops.name",S.name)}catch(e){}home();}
function nameScreen(){const t=UI[lang],hi="Hello! I am Teacher Thandi. What is your name?";
$("#app").innerHTML=`<div class="brandbar">PIXELPROTECH <span>SOLUTIONS</span></div><h1>OOPS ACADEMY<small>${t.tag}</small></h1>
<div class="stage"><div class="who"><div class="face" style="font-size:60px">👩🏾‍🏫</div><div class="bubble teach"><b>Teacher Thandi:</b> ${hi}</div></div>
<p><input id="nm" class="nm" maxlength="16" placeholder="Type your name" autocomplete="given-name" aria-label="Your name"></p>
<div class="row"><button id="hr" class="grow">🔊 ${t.read}</button><button id="nmic" class="grow">🎤 Say my name</button><button id="ngo" class="grow go">Let's go!</button></div></div>`;
$("#nm").addEventListener("keydown",e=>{if(e.key==="Enter")saveName($("#nm").value)});
$("#ngo").onclick=()=>saveName($("#nm").value);$("#hr").onclick=()=>speak(hi,0);
$("#nmic").onclick=()=>{const Rc=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rc){$("#nm").placeholder="Please type your name";return}
const r=new Rc();r.lang="en-ZA";r.onresult=e=>{$("#nm").value=e.results[0][0].transcript.replace(/^(my name is|i am|i'm|it's)\s+/i,"").replace(/[.,!?]/g,"")};try{r.start();$("#nm").placeholder="Listening..."}catch(e){}};
setTimeout(()=>speak(hi,0),400);}
/* ---------- screens ---------- */
function home(){if(!S.name)return nameScreen();const t=UI[lang];window.speechSynthesis&&speechSynthesis.cancel();
$("#app").innerHTML=`<div class="tools"><button id="inst" hidden>📲 Install app</button><button id="vt">🔊 ${t.sound}: ${S.voice?"On":"Off"}</button></div>
<div class="brandbar">PIXELPROTECH <span>SOLUTIONS</span></div><h1>OOPS ACADEMY<small>${t.tag}</small></h1>
<div class="stage"><b>${t.grade}</b><div class="row grades" style="margin-top:10px">${[0,1,2].map(g=>`<button class="grow ${S.grade===g?"on":""}" data-g="${g}">${t[g?"g"+g:"gR"]}</button>`).join("")}</div></div>
<b>Hi ${esc(S.name)}! ${t.pick}</b> <button id="cn" style="padding:4px 10px;font-size:14px">Change name</button><div class="subj">${SUBJ.map(s=>`<button data-s="${s.id}"><span class="e">${CHARS[s.c].e}${s.e}</span><b>${s.n}</b>${CHARS[s.c].n}</button>`).join("")}</div>
<p class="note">For parents: Super Safe Squad teaches saying no and telling a trusted adult. In South Africa, children can call Childline free on 116. No account needed; only the grade choice is saved on this device. Voice works best in Chrome or Edge.</p><footer class="brand"><b>PIXELPROTECH SOLUTIONS (PTY) LTD</b><br>Field IT engineering &amp; digital systems<br>Johannesburg &bull; Pretoria &bull; Centurion &bull; Gauteng<br><a href="https://pixelprotechsolutions.co.za" target="_blank" rel="noopener">pixelprotechsolutions.co.za</a><br><a href="mailto:pixelprotechsolutions@proton.me">pixelprotechsolutions@proton.me</a> &nbsp; <a href="tel:0651971461">065 197 1461</a><small>Reg 2026/622131/07 &middot; OOPS ACADEMY is a PixelProTech digital system.</small></footer>`;
$("#vt").onclick=()=>{S.voice=!S.voice;home()};$("#cn").onclick=()=>{S.name="";try{localStorage.removeItem("oops.name")}catch(e){}nameScreen()};
if(dp)$("#inst").hidden=false;$("#inst").onclick=async()=>{dp.prompt();await dp.userChoice;dp=null;$("#inst").hidden=true};
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.grade=+b.dataset.g;try{localStorage.setItem("oops.grade",S.grade)}catch(e){}home()});
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>start(SUBJ.find(s=>s.id===b.dataset.s)));}
function start(s){S.subj=s;S.qs=build(s,S.grade);S.i=0;S.stars=0;S.tries=0;question();}
function question(){const t=UI[lang],q=S.qs[S.i],c=CHARS[q.ch];S.tries=0;q.shown=shuf(q.opts);
$("#app").innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><button id="bk">← ${t.back}</button><div class="tools"><button id="rd">🔊 ${t.read}</button><button id="mc">🎤 ${t.mic}</button></div></div>
<div class="bar" style="margin:12px 0"><i style="width:${S.i/S.qs.length*100}%"></i></div>
<div class="stage"><div class="who"><div class="face" id="face">${c.e}</div><div class="bubble"><b>${c.n}:</b> ${q.story}</div></div><div class="who" style="margin-top:12px"><div class="face" style="font-size:60px">👩🏾‍🏫</div><div class="bubble teach" id="bub"><b>Teacher Thandi:</b> Listen carefully, then pick the answer.</div></div>
${q.vis?`<div class="vis" aria-hidden="true">${q.vis}</div>`:""}<div class="q">${q.q}</div>
<div class="opts">${q.shown.map(o=>`<button data-o="${o.replace(/"/g,"&quot;")}">${o}</button>`).join("")}</div></div><p class="note">${t.hint}</p>`;
const say=()=>speak(q.story+" "+q.q+". "+q.shown.join(". Or. "),q.ch);
$("#bk").onclick=home;$("#rd").onclick=say;$("#mc").onclick=()=>listen(q);
document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answer(b,q));
setTimeout(say,300);}
function react(cls,text,q){const f=$("#face");f.className="face";void f.offsetWidth;f.className="face "+cls;$("#bub").innerHTML=`<b>Teacher Thandi:</b> ${text}`;speak(text,q.ch);}
const STRAT={math:"Count slowly. Touch each one and count out loud, or use your fingers.",eng:"Say the word out loud, slowly, sound by sound.",talk:"Think: what would be kind and polite? How would your friend feel?",safe:"Ask yourself: do I feel safe? A trusted grown-up can always help."};
function next(){S.i++;S.i<S.qs.length?question():finish()}
function answer(btn,q){const t=UI[lang],val=btn.dataset.o,n=S.name,all=document.querySelectorAll("[data-o]");
if(val===q.ans){btn.classList.add("good");if(S.tries===0)S.stars++;all.forEach(b=>b.disabled=true);
react("hop",pick(t.ok).replace("{n}",n)+" "+q.fun,q);setTimeout(next,4200);}
else{S.tries++;btn.classList.add("no");btn.disabled=true;
if(S.tries>=2){all.forEach(b=>{b.disabled=true;if(b.dataset.o===q.ans)b.classList.add("good")});
react("hop",`That's okay, ${n}. Let's learn it together. The answer is ${q.ans}. ${q.fun}`,q);setTimeout(next,6500);}
else react("shake",t.calm.replace("{n}",n)+" "+STRAT[S.subj.id]+" Then try again.",q);}}
function finish(){const t=UI[lang],n=S.stars,c=CHARS[S.subj.c];
$("#app").innerHTML=`<h1>${t.done}</h1><div class="stage" style="text-align:center"><div class="face hop">${c.e}</div>
<div class="stars" aria-label="${n} stars">${"⭐".repeat(n)}${"☆".repeat(5-n)}</div>
<p>${esc(S.name)}, ${n>=4?"you are a true Oops Hero!":n>=2?"great work! Try for more stars!":"good try! Practice makes heroes."}</p>
<div class="row" style="justify-content:center"><button id="ag">${t.again}</button><button id="hm">${t.home}</button></div></div>`;
speak(n>=4?`${S.name}, you are a true Oops Hero!`:`Well done, ${S.name}! Let's play again!`,S.subj.c);
$("#ag").onclick=()=>start(S.subj);$("#hm").onclick=home;}
function listen(q){const R=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!R){$("#bub").innerHTML="Voice answers aren't supported in this browser. Please tap an answer!";return}
const r=new R();r.lang="en-ZA";r.onresult=e=>{const h=e.results[0][0].transcript.toLowerCase().replace(/[.,!?]/g,"");
const W="zero one two three four five six seven eight nine ten".split(" ");
const m=[...document.querySelectorAll("[data-o]")].find(b=>{const o=b.dataset.o.toLowerCase();return h.includes(o)||(/^\d+$/.test(o)&&(h.includes(o)||W[+o]===h.trim()))||o.includes(h.trim())&&h.trim().length>2});
if(m)m.click();else $("#bub").innerHTML="I heard \""+h+"\". Try again or tap an answer!"};
r.onerror=()=>{$("#bub").innerHTML="I couldn't hear you. Please tap an answer!"};try{r.start();$("#bub").innerHTML="🎤 Listening..."}catch(e){}}
if(window.speechSynthesis)speechSynthesis.getVoices();
let dp=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;const b=$("#inst");if(b)b.hidden=false});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
home();
</script></body></html>
